flags:
  GOOD:
    bit: null
    description: |
      No bits set, all is good
  DO_NOT_USE:
    bit: 0
    description: |
      Bad pixel. Do not use
  SATURATED:
    bit: 1
    description: |
      Pixel saturated during exposure
  JUMP_DET:
    bit: 2
    description: |
      Jump detected during exposure
  DROPOUT:
    bit: 3
    description: |
      Data lost in transmission
  AD_FLOOR:
    bit: 6
    description: |
      Below A/D floor (0 DN, was RESERVED_3)
